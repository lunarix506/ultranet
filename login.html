<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultranet Pay Login</title>
</head>

<body>

    <h1>Ultranet Pay Login</h1>

    <form id="loginForm">

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            LOGIN
        </button>

    </form>

    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const email =
                document.getElementById("loginEmail").value
                .trim()
                .toLowerCase();

            const password =
                document.getElementById("loginPassword").value;

            const savedEmail =
                localStorage.getItem("ultranetEmail");

            const savedPassword =
                localStorage.getItem("ultranetPassword");

            if (email === savedEmail && password === savedPassword) {
                alert("Login successful!");
                localStorage.setItem("ultranetLoggedIn", "true");
                window.location.href = "dashboard.html";
            } else {
                alert("Incorrect email or password.");
            }
        });
    </script>

</body>
</html>
